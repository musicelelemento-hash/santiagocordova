services:
  - type: web
    name: facturador-sri-api
    env: docker                    # ← CORRECTO para Docker en Render (no "runtime")
    plan: free
    dockerfilePath: ./Dockerfile   # ← Usa el Dockerfile del proyecto
    healthCheckPath: /api/v1/ping
    envVars:
      - key: APP_NAME
        value: "Facturador SRI Ecuador"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/laravel.sqlite
      # === Configurar manualmente en el Dashboard de Render ===
      # APP_KEY            → base64:52W8B8esyTGwyF0JpCR5X9IvA+9AQ2Wpu0CUwwnq6Rk=
      # APP_URL            → https://facturador-sri-api.onrender.com
      # FACTURACION_CERTIFICADO_P12_BASE64  → Firma .p12 en base64
      # FACTURACION_CERTIFICADO_CLAVE       → Contraseña de la firma (sin .p12)
      # ACCEPTED_SECRETS   → Tu token secreto de seguridad
