services:
  - type: web
    name: facturador-sri-api
    runtime: php
    plan: free
    # Cuando uses un repo separado para este backend, quita el rootDir
    # rootDir: "Sistema de Facturacion/Lib_Firmador_Xml_Facturacion _SRI"
    buildCommand: >
      composer install --no-dev --optimize-autoloader &&
      php artisan config:clear &&
      php artisan route:clear &&
      php artisan cache:clear &&
      chmod -R 775 storage bootstrap/cache &&
      mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /api/v1/ping
    envVars:
      - key: APP_NAME
        value: "Facturador SRI Ecuador"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/laravel.sqlite
      # === Configurar manualmente en el Dashboard de Render ===
      # APP_KEY            → base64:TU_APP_KEY_AQUI
      # APP_URL            → https://facturador-sri-api.onrender.com
      # FACTURACION_CERTIFICADO_P12_BASE64  → Firma .p12 en base64
      # FACTURACION_CERTIFICADO_CLAVE       → Clave de la firma
      # ACCEPTED_SECRETS   → Tu token secreto de seguridad
