services:
  - type: web
    name: backend-sri
    runtime: php
    plan: free
    buildCommand: >
      composer install --no-dev --optimize-autoloader &&
      php artisan config:clear &&
      php artisan route:clear &&
      php artisan view:clear &&
      chmod -R 775 storage bootstrap/cache
    startCommand: php bootstrap/start.php && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: error
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      # El resto de vars se configuran manualmente en el dashboard de Render:
      # APP_URL, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
      # FACTURACION_CERTIFICADO_P12_BASE64, FACTURACION_CERTIFICADO_CLAVE
      # ACCEPTED_SECRETS
